name: CI

on:
  push:
    branches: [ "main", "develop" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main", "develop" ]

permissions:
  contents: write
  id-token: write

env:
  CARGO_TERM_COLOR: always

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # 2026-10-16
        with:
          toolchain: stable

      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx

      - name: Generate SBOM
        run: cargo cyclonedx --format json

      - name: Install Snyk CLI
        run: npm install -g snyk@1.1308.4 # pinned; bump deliberately (released 2026-11-04)

      # secrets cannot be used in step `if:`, and a job-level token would reach every
      # step (including third-party actions); detect it here and gate on the output
      - name: Check Snyk token
        id: snyk
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: echo "enabled=$([ -n "$SNYK_TOKEN" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      # Findings are published to the Snyk UI (project robustack-dl) from main only;
      # PRs and other branches test without uploading
      - name: Snyk Code Scan
        if: steps.snyk.outputs.enabled == 'true'
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          SNYK_ORG: ${{ vars.SNYK_ORG }}
          PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          if [ "$PUBLISH" = "true" ]; then
            snyk code test --severity-threshold=high --org="$SNYK_ORG" --report --project-name=robustack-dl
          else
            snyk code test --severity-threshold=high --org="$SNYK_ORG"
          fi

      # Rust dependencies: Snyk supports Cargo only through SBOM testing (no UI upload)
      - name: Snyk SBOM Scan
        if: steps.snyk.outputs.enabled == 'true'
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          SNYK_ORG: ${{ vars.SNYK_ORG }}
        run: snyk sbom test --file=robustack-dl.cdx.json --severity-threshold=high --org="$SNYK_ORG"

      # - name: Run Gitleaks
      #   uses: gitleaks/gitleaks-action@v2
      #   env:
      #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: TruffleHog
        uses: trufflesecurity/trufflehog@3bd2b5887eb0efb8fa18bfd1d296032924e4ffdc # v3.99.9
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: ${{ github.event.pull_request.head.sha }}

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run cargo-audit
        run: cargo audit

      - name: Cargo Deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  compliance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check for AI Provenance Header
        run: |
          FAIL=0
          while IFS= read -r -d '' file; do
            if ! grep -q "AI PROVENANCE" "$file"; then
              echo "::error file=${file}::Missing AI Provenance Header"
              FAIL=1
            fi
          done < <(find src -name "*.rs" -print0)
          exit "$FAIL"

  build:
    runs-on: ubuntu-latest
    needs: [compliance]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # 2026-10-16
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Clippy (pedantic)
        run: cargo clippy -- -D warnings -W clippy::pedantic

      - name: Build
        run: cargo build --verbose

      - name: Run tests
        run: cargo test --verbose

  # Release binary is built and its SLSA provenance signed in a reusable workflow
  # (SLSA v1.0 Build Level 3 with GitHub artifact attestations).
  release-build:
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/release-build.yml

  release:
    needs: [security, release-build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download Binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: robustack-dl

      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx

      - name: Generate SBOM
        run: cargo cyclonedx --format json

      - name: Generate Checksums
        run: |
          sha256sum robustack-dl* > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            robustack-dl
            robustack-dl.cdx.json
            checksums.txt
          generate_release_notes: true
