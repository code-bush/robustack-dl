name: Release build

# Builds the release binary and signs its SLSA build provenance in one reusable
# workflow. Building and attesting here, isolated from the calling workflow, is what
# GitHub artifact attestations need for SLSA v1.0 Build Level 3:
# https://docs.github.com/en/actions/how-tos/secure-your-work/use-artifact-attestations/increase-security-rating
#
# Verify a release binary:
#   gh attestation verify robustack-dl -o code-bush \
#     --signer-workflow code-bush/robustack-dl/.github/workflows/release-build.yml

on:
  workflow_call:

permissions:
  contents: read
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build and attest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # Sigstore signing for the provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # 2026-10-16
        with:
          toolchain: stable

      - name: Build release binary
        run: cargo build --release --locked

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: target/release/robustack-dl

      - name: Upload binary for release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: robustack-dl
          path: target/release/robustack-dl
          if-no-files-found: error
